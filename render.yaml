# One-click demo on Render (free plan). The free disk is wiped on every restart/deploy, so the
# server re-creates the super admin and demo data on start. Passwords: Render dashboard ->
# the service -> Environment. For real use, add a PostgreSQL database and set DATABASE_URL.
services:
  - type: web
    name: uu-college-erp
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TZ
        value: Asia/Kolkata
      - key: TRUST_PROXY
        value: "1"
      - key: SEED_DEMO
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
