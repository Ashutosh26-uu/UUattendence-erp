# Render blueprint: the web app + a PostgreSQL database.
# Free plan notes: the free database expires 30 days after it is created (upgrade it to a paid
# plan in the Render dashboard to keep the data), and the free web service sleeps after 15
# minutes without visits. Passwords: Render dashboard -> uu-college-erp -> Environment.
databases:
  - name: uu-erp-db
    plan: free
    databaseName: uu_erp
    user: uu_erp

services:
  - type: web
    name: uu-college-erp
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TZ
        value: Asia/Kolkata
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: uu-erp-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: SEED_DEMO
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: SUPER_ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_PASSWORD
        generateValue: true
